name: Windows development checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      LUMA_DATA_DIR: ${{ github.workspace }}/.ci-data
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install locked development dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-lock.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch reviewed build voice
        run: .\.venv\Scripts\python.exe tools/fetch_build_voice.py
      - name: Functional tests
        run: .\.venv\Scripts\python.exe -m pytest tests -q
      - name: Build with matching source identity
        run: .\.venv\Scripts\python.exe tools/build_windows.py
      - name: Standalone diagnostic
        run: |
          $env:LUMA_TEST_VOICE=Join-Path $PWD 'dist/Luma/_internal/voices/en_GB-cori-high.onnx'
          $report=Join-Path $env:RUNNER_TEMP 'luma-diagnostic.json'
          # Prove the child can run without Python or developer tools on PATH.
          $env:PATH="$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($variable in @('PYTHONHOME','PYTHONPATH','VIRTUAL_ENV','QT_PLUGIN_PATH','QT_QPA_PLATFORM_PLUGIN_PATH','QML_IMPORT_PATH','QML2_IMPORT_PATH')) {
            [Environment]::SetEnvironmentVariable($variable,$null,'Process')
          }
          $process=Start-Process -FilePath 'dist/Luma/Luma.exe' -ArgumentList '--self-test',('"'+$report+'"') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $result=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw 'Standalone diagnostic failed' }
      - name: Verify candidate archive
        run: .\.venv\Scripts\python.exe tools/archive_build.py
      # No release publishing, artifact upload or secrets are configured here.
